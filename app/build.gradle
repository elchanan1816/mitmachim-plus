plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }
android {
 namespace 'community.mitmachim.nativeapp'
 compileSdk 36
 defaultConfig {
  applicationId 'community.mitmachim.reader'
  minSdk 24
  targetSdk 35
  versionCode 29
  versionName '0.2.13'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 buildFeatures { compose true; buildConfig false }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget='17' }
 signingConfigs {
  distribution {
   def signingPath = System.getenv('MITMACHIM_RELEASE_STORE_FILE')
   def signingPassword = System.getenv('MITMACHIM_RELEASE_PASSWORD')
   if (signingPath && signingPassword) {
    storeFile file(signingPath)
    storePassword signingPassword
    keyAlias 'mitmachim-release'
    keyPassword signingPassword
   }
  }
 }
 buildTypes { debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }; release { minifyEnabled false; signingConfig signingConfigs.distribution } }
 packaging { resources.excludes += '/META-INF/{AL2.0,LGPL2.1}' }
}
dependencies {
 implementation platform('androidx.compose:compose-bom:2025.10.01')
 implementation 'androidx.activity:activity-compose:1.11.0'
 implementation 'androidx.browser:browser:1.9.0'
 implementation 'androidx.compose.material3:material3'
 implementation 'androidx.compose.ui:ui-tooling-preview'
 implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
 implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
 implementation 'androidx.core:core-ktx:1.17.0'
 implementation 'androidx.work:work-runtime-ktx:2.10.1'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'org.jsoup:jsoup:1.18.3'
 implementation 'com.android.tools.build:apksig:8.13.0'
 implementation 'io.coil-kt:coil-compose:2.7.0'
 implementation 'org.commonmark:commonmark:0.24.0'
 implementation 'org.commonmark:commonmark-ext-gfm-tables:0.24.0'
 implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.24.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
 testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
 androidTestImplementation platform('androidx.compose:compose-bom:2025.10.01')
 androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
